name: General IFC/PDF logic tests
on:
  push:
    branches: [original-code-supervisor-fix-2026-10-20, wall-first-supervisor-2026-10-28]
  pull_request:
    paths: ['**/*.py', 'requirements.txt']
jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'pypdf>=5,<7'
      - run: python -m compileall -q app.py audit_engine.py check_ifc_compliance.py spec_context.py ifc_to_neo4j.py llm_assistance.py validation_export.py evidence_linking.py prompt_repeatability.py wall_focus.py reporting.py assembly_evidence.py semantic_links.py link_validation.py llm_gateway.py controlled_demo.py controlled_cavity_test.py
      - run: pytest -q tests/test_v4_portability.py tests/test_gemini_reliability.py tests/test_supervisor_closure.py tests/test_wall_focus.py tests/test_reporting.py tests/test_pdf_context.py tests/test_assembly_evidence.py tests/test_semantic_links.py tests/test_link_validation.py tests/test_llm_gateway.py tests/test_controlled_demo.py tests/test_controlled_cavity_test.py
