name: General IFC/PDF logic tests
on:
  push:
    branches: [supervisor-revision-v4-generic-2026-10-19]
  pull_request:
    paths: ['**/*.py', 'requirements.txt']
jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'pypdf>=5,<7'
      - run: python -m compileall -q app.py audit_engine.py check_ifc_compliance.py spec_context.py ifc_to_neo4j.py llm_assistance.py validation_export.py
      - run: pytest -q tests/test_v4_portability.py
